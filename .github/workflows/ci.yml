name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Import smoke test (GUI module loads off-screen)
        shell: bash
        run: QT_QPA_PLATFORM=offscreen python -c "import video_toolkit.app.main_window"
        if: runner.os == 'Windows'
