name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: pyinstaller toolkit.spec
      - name: Smoke-run the exe (CLI trim of a generated clip)
        shell: pwsh
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=320x240:rate=25:duration=3 -f lavfi -i sine=frequency=440:duration=3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest clip.mp4
          # A windowed exe detaches from the console, so wait on the process explicitly.
          $p = Start-Process -FilePath (Resolve-Path dist\VideoToolkit.exe) -ArgumentList "--cli","trim","clip.mp4","--start","0.5","--end","2","--out-dir","out_test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe smoke test failed with exit code $($p.ExitCode)" }
          $mp4 = Get-ChildItem out_test -Filter *.mp4
          if (-not $mp4) { throw "exe produced no video" }
          $mp4
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoToolkit.exe
          generate_release_notes: true
