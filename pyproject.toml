[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-toolkit"
version = "0.1.0"
description = "Everyday video jobs on top of FFmpeg: trim, join, speed, reverse, audio, compress, convert, crop, loop, frames, GIF, overlay. PySide6 GUI + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anas (PhantomAnas)" }]
keywords = ["video", "ffmpeg", "editor", "trim", "gif", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = ["PySide6>=6.6", "platformdirs>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/PhantomAnas/video-toolkit"
Issues = "https://github.com/PhantomAnas/video-toolkit/issues"

[project.scripts]
video-toolkit = "video_toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_toolkit = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
